<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Login - Dinamicash Wallet</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body data-page-title="loginPageTitle">
  <div class="login-container">
    <div class="brand-title brand-title-login">
      <img class="section-logo" src="assets/logo-mark-dw.svg" alt="Dinamicash Wallet">
      <div class="brand-copy">
        <h1 data-i18n="appName">Dinamicash Wallet</h1>
        <p class="brand-subtitle">Controla tus gastos, toma el control</p>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="loginHeading">Iniciar sesión</h2>

      <form id="loginForm">
        <input type="email" id="correo" data-i18n-placeholder="email" placeholder="Correo" required>
        <input type="password" id="password" inputmode="numeric" maxlength="4" pattern="\d{4}" data-i18n-placeholder="password" placeholder="PIN de 4 digitos" required>
        <label class="remember-login">
          <input type="checkbox" id="recordarme">
          <span>Recordar correo</span>
        </label>
        <button type="submit" data-i18n="loginButton">Ingresar</button>
      </form>

      <button type="button" id="biometricLoginBtn" class="secondary-btn biometric-login" hidden>
        Ingresar con huella
      </button>
      <p id="biometricStatus" class="biometric-status"></p>

      <div class="links">
        <p onclick="irRegistro()" data-i18n="registerLink">Registrarse</p>
        <p onclick="olvido()" data-i18n="forgotPassword">Olvidaste tu PIN?</p>
      </div>

    </div>
  </div>

  <div class="login-credit">
    Hecho con amor por: Sebastian Andres Castañeda Panqueva
  </div>
  <div class="login-version">
    v1.6.0
  </div>

  <script src="i18n.js"></script>
  <script src="api.js"></script>
  <script src="login.js"></script>
</body>
</html>
