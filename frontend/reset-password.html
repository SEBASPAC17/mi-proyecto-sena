<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Restablecer PIN - Dinamicash Wallet</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="login-container">
    <div class="brand-title brand-title-login">
      <img class="section-logo" src="assets/logo-mark-dw.svg" alt="Dinamicash Wallet">
      <div class="brand-copy">
        <h1>Dinamicash Wallet</h1>
        <p class="brand-subtitle">Controla tus gastos, toma el control</p>
      </div>
    </div>
    <div class="card">
      <h2 id="titulo">Restablecer PIN</h2>
      <p id="descripcion" style="color:#94a3b8;font-size:14px;">Escribe tu nuevo PIN para terminar el proceso.</p>
      <form id="resetForm">
        <input id="passwordNueva" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" placeholder="Nuevo PIN" required>
        <input id="passwordConfirmacion" type="password" inputmode="numeric" maxlength="4" pattern="\d{4}" placeholder="Confirmar PIN" required>
        <button type="submit" id="guardarBtn">Guardar nuevo PIN</button>
      </form>
      <p id="estado" style="color:#94a3b8;font-size:14px;margin-top:12px;"></p>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="api.js"></script>
  <script>
    const API_URL = window.DinamicashApi?.getBaseUrl?.() || "http://localhost:3000";
    const lang = window.DinamicashI18n?.getPreferredLanguage?.() || "es";
    const texts = {
      es: {
        title: "Restablecer PIN",
        description: "Escribe tu nuevo PIN para terminar el proceso.",
        newPassword: "Nuevo PIN",
        confirmPassword: "Confirmar PIN",
        submit: "Guardar nuevo PIN",
        loading: "Procesando...",
        mismatch: "Los PIN deben coincidir",
        short: "El PIN debe tener exactamente 4 dígitos numéricos",
        success: "Tu PIN fue actualizado. Ahora puedes iniciar sesión.",
        invalid: "El enlace no es válido o ya venció",
        missing: "No encontramos un token válido en el enlace"
      },
      en: {
        title: "Reset PIN",
        description: "Enter your new PIN to complete the process.",
        newPassword: "New PIN",
        confirmPassword: "Confirm PIN",
        submit: "Save new PIN",
        loading: "Processing...",
        mismatch: "PIN values must match",
        short: "PIN must be exactly 4 numeric digits",
        success: "Your PIN was updated. You can now sign in.",
        invalid: "The link is invalid or has expired",
        missing: "No valid token was found in the link"
      },
      pt: {
        title: "Redefinir PIN",
        description: "Digite seu novo PIN para concluir o processo.",
        newPassword: "Novo PIN",
        confirmPassword: "Confirmar PIN",
        submit: "Salvar novo PIN",
        loading: "Processando...",
        mismatch: "Os PIN precisam ser iguais",
        short: "O PIN deve ter exatamente 4 dígitos numéricos",
        success: "Seu PIN foi atualizado. Agora você pode entrar.",
        invalid: "O link é inválido ou expirou",
        missing: "Nenhum token válido foi encontrado no link"
      }
    }[lang] || {
      title: "Restablecer PIN",
      description: "Escribe tu nuevo PIN para terminar el proceso.",
      newPassword: "Nuevo PIN",
      confirmPassword: "Confirmar PIN",
      submit: "Guardar nuevo PIN",
      loading: "Procesando...",
      mismatch: "Los PIN deben coincidir",
      short: "El PIN debe tener exactamente 4 dígitos numéricos",
      success: "Tu PIN fue actualizado. Ahora puedes iniciar sesión.",
      invalid: "El enlace no es válido o ya venció",
      missing: "No encontramos un token válido en el enlace"
    };

    document.documentElement.lang = lang;
    document.title = `${texts.title} - Dinamicash Wallet`;
    document.getElementById("titulo").textContent = texts.title;
    document.getElementById("descripcion").textContent = texts.description;
    document.getElementById("passwordNueva").placeholder = texts.newPassword;
    document.getElementById("passwordConfirmacion").placeholder = texts.confirmPassword;
    document.getElementById("guardarBtn").textContent = texts.submit;

    document.getElementById("resetForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const token = new URLSearchParams(window.location.search).get("token");
      const passwordNueva = document.getElementById("passwordNueva").value.trim();
      const passwordConfirmacion = document.getElementById("passwordConfirmacion").value.trim();
      const estado = document.getElementById("estado");

      if (!token) {
        estado.textContent = texts.missing;
        return;
      }

      if (passwordNueva !== passwordConfirmacion) {
        alert(texts.mismatch);
        return;
      }

      if (!/^\d{4}$/.test(passwordNueva)) {
        alert(texts.short);
        return;
      }

      estado.textContent = texts.loading;

      try {
        const res = await fetch(`${API_URL}/restablecer-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, passwordNueva })
        });
        const data = await res.json();

        if (!res.ok || !data.ok) {
          estado.textContent = data.mensaje || texts.invalid;
          return;
        }

        alert(data.mensaje || texts.success);
        window.location.href = "login.html";
      } catch (error) {
        console.error(error);
        estado.textContent = texts.invalid;
      }
    });
  </script>
</body>
</html>
